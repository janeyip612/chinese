<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>乐学坊 · 生词与句子</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one practice desk — a sentence prompt on top, a tray to build in, word tiles underneath; sets chosen from the 主题地图 grid */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#1b2a27; --muted:#5b6b66; --line:#d3dcd6;
  --accent:#2f7a63; --accent-ink:#ffffff; --accent-soft:#dcece4;
  --tile:#fffaf0; --tile-line:#e4d7b5; --tile-shadow:#d9c99f;
  --ok:#22703c; --ok-soft:#ddf0e2; --bad:#b23a2c; --bad-soft:#f8e2de; --warn:#8a5a00; --warn-soft:#f6eacb;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-han:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a18; --surface:#1a2522; --ink:#e5ece8; --muted:#9db0aa; --line:#2d3b37;
  --accent:#6cc4a2; --accent-ink:#0e1a16; --accent-soft:#1d3a30;
  --tile:#26302b; --tile-line:#3d4a43; --tile-shadow:#0d1412;
  --ok:#6bcb86; --ok-soft:#1c3525; --bad:#f08a80; --bad-soft:#3a1f1c; --warn:#e3b45a; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a18; --surface:#1a2522; --ink:#e5ece8; --muted:#9db0aa; --line:#2d3b37;
  --accent:#6cc4a2; --accent-ink:#0e1a16; --accent-soft:#1d3a30;
  --tile:#26302b; --tile-line:#3d4a43; --tile-shadow:#0d1412;
  --ok:#6bcb86; --ok-soft:#1c3525; --bad:#f08a80; --bad-soft:#3a1f1c; --warn:#e3b45a; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font-family:var(--f-han);font-size:clamp(26px,5vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance;line-height:1.2}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.name{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.name input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:150px;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.panel h2{margin:0;font-size:17px}
.note{font-size:13px;color:var(--muted)}
/* set picker */
.sets{width:100%;border-collapse:separate;border-spacing:8px}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 4px}
.sets td.tn{font-weight:700;white-space:nowrap;padding-right:4px;vertical-align:middle}
.setbtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:3px;min-height:76px}
.setbtn:hover{border-color:var(--accent)}
.setbtn b{font-size:13px;color:var(--accent)}
.setbtn span{font-size:13px;color:var(--ink)}
.setbtn.l1{background:transparent;border-style:dashed}
.setbtn .done{font-size:12px;color:var(--ok)}
.scroll{overflow-x:auto}
/* practice */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.qnum{font-weight:700;font-variant-numeric:tabular-nums}
.pill{font-size:12.5px;background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.prompt{font-size:21px;font-weight:500;margin:0;text-wrap:balance}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tray{min-height:92px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.tray.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tray .ph{color:var(--muted);font-size:14px;padding-left:4px}
.tray .end{font-family:var(--f-han);font-size:28px;color:var(--muted);align-self:flex-end;padding-bottom:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:66px}
.tile{border:1px solid var(--tile-line);background:var(--tile);border-radius:10px;padding:6px 13px 7px;display:flex;flex-direction:column;align-items:center;min-width:56px;box-shadow:0 3px 0 var(--tile-shadow)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tile-shadow)}
.tile .h{font-family:var(--f-han);font-size:27px;line-height:1.2}
.tile .p{font-size:13px;color:var(--accent);font-weight:500;min-height:1.2em}
body.nopy .tile .p,body.nopy .ans .p{display:none}
.tile.used{visibility:hidden}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.show{background:var(--warn-soft);color:var(--warn)}
.ans{display:block;color:var(--ink);font-family:var(--f-han);font-size:22px;margin-top:2px}
.ans .p{display:block;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.btnrow>div{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.dot.first{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.retry{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.shown{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
/* result */
.score{display:flex;flex-wrap:wrap;gap:12px 28px}
.score div{display:grid}
.score b{font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--muted)}
.rlist{border-collapse:collapse;width:100%;font-size:14px}
.rlist td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.rlist td.hz{font-family:var(--f-han);font-size:19px}
.rlist .mine{display:block;font-family:var(--f-han);font-size:16px;color:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.first{background:var(--ok-soft);color:var(--ok)}
.tag.retry{background:var(--accent-soft);color:var(--accent)}
.tag.shown{background:var(--warn-soft);color:var(--warn)}
.msg{font-size:14px;color:var(--accent);min-height:1.3em}
.msg.err{color:var(--bad)}
/* word cards: tap to flip; front = hanzi (+pinyin), back = sound + English + Vietnamese */
.view{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:-4px}
.view button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:500;color:var(--muted)}
.view button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;height:150px;border:0;padding:0;background:none;perspective:900px;cursor:pointer;font:inherit;color:inherit}
.card .in{position:absolute;inset:0;transform-style:preserve-3d}
.card.on .in{transform:rotateY(180deg)}
.card .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;text-align:center}
.card .fr{background:var(--tile);border:1px solid var(--tile-line);box-shadow:0 3px 0 var(--tile-shadow)}
.card .bk{background:var(--surface);border:2px solid var(--accent);transform:rotateY(180deg)}
.card .fr .h{font-family:var(--f-han);font-size:38px;line-height:1.15}
.card .fr .p{font-size:15px;color:var(--accent);font-weight:500}
.card .bk .h{font-family:var(--f-han);font-size:24px;line-height:1.2}
.card .bk .p{font-size:13px;color:var(--accent);font-weight:500}
.card .bk .m{font-size:14px;line-height:1.3}
.card .bk .m2{font-size:13px;color:var(--muted);line-height:1.3}
.card .snd{position:absolute;top:6px;right:8px;font-size:16px;opacity:.75}
.card .fw{position:absolute;top:7px;left:9px;font-size:11px;color:var(--muted)}
body.nopy .card .fr .p{display:none}
.cardbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.cardbar>div{display:flex;flex-wrap:wrap;gap:8px}
.setbtn .wl{font-family:var(--f-han);font-size:16px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card .in{transition:transform .45s}}
@media (max-width:560px){.cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.card{height:136px}.card .fr .h{font-size:32px}}
@media (max-width:560px){.prompt{font-size:18px}.tile .h{font-size:24px}.sets{border-spacing:5px}}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .08s}}
</style>

const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lxs-lang","en"), py=store.get("lxs-py","1")==="1";
let view=location.hash==="#words"?"words":store.get("lxs-view","sent"), wsel=null, wflip=new Set(), worder=null;
let run=null; // {si, order:[], i, items:[{tries, first, shown, ok}], tray:[], bankOrder:[], state}
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const zh=q=>q.t.map(x=>x[0]).join("")+q.e;
const pyOf=q=>q.t.map(x=>x[1]).filter(Boolean).join(" ");
const doneKey=si=>"lxs-done-"+SETS[si].t+"-"+SETS[si].l;

$("who").value=store.get("lxs-name","");
$("who").addEventListener("input",()=>store.set("lxs-name",$("who").value.trim()));
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("lxs-lang",lang);syncTop();render()});
$("pyOn").onclick=()=>{py=true;store.set("lxs-py","1");syncTop()};
$("pyOff").onclick=()=>{py=false;store.set("lxs-py","0");syncTop()};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set("lxs-view",view);try{history.replaceState(null,"",view==="words"?"#words":location.pathname+location.search)}catch(e){}syncTop();render();window.scrollTo({top:0})});
function syncTop(){
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===view)));
  $("ttl").textContent=view==="words"?"生词卡":"句子练习";
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  $("pyOn").setAttribute("aria-pressed",String(py));$("pyOff").setAttribute("aria-pressed",String(!py));
  document.body.classList.toggle("nopy",!py);
}
const LI=()=>lang==="vi"?2:1;

function render(){
  const app=$("app");
  if(view==="words"){wsel?renderCards(app):renderWordMap(app);return}
  if(!run){renderPicker(app);return}
  if(run.i<run.order.length){renderQ(app);return}
  renderResult(app);
}
function renderPicker(app){
  let h=`<section class="panel"><h2>选一组句子 · ${lang==="vi"?"Chọn một bộ câu":"Choose a set"}</h2>
  <p class="note">${lang==="vi"?"Nhìn câu tiếng Việt, xếp các thẻ chữ Hán thành câu tiếng Trung. Làm xong có thể lưu PDF gửi cô giáo.":"Read the English sentence and put the Chinese word tiles in order. When you finish, save a PDF to send to your teacher."}</p>
  <div class="scroll"><table class="sets"><thead><tr><th>${lang==="vi"?"Chủ đề":"Theme"}</th>${[1,2,3].map(l=>`<th>${lvName(l)}</th>`).join("")}</tr></thead><tbody>`;
  THEMES.forEach((T,ti)=>{
    h+=`<tr><td class="tn">${ti+1}. ${tName(ti)}<div class="note" style="font-weight:400">${T[0]}</div></td>`;
    h+=`<td><button class="setbtn l1" data-wt="${ti}"><b>${lang==="vi"?"Thẻ từ":"Word cards"} · ${WMAP[ti].L[0].length}</b><span>${L1CD[ti][LI()]}</span></button></td>`;
    [2,3].forEach(l=>{const si=SETS.findIndex(s=>s.t===ti+1&&s.l===l),S=SETS[si],d=store.get(doneKey(si),"");
      h+=`<td><button class="setbtn" data-si="${si}"><b>${S.q.length} ${lang==="vi"?"câu":"sentences"}</b><span>${S.cd[LI()]}</span>${d?`<span class="done">✓ ${esc(d)}</span>`:""}</button></td>`});
    h+=`</tr>`;
  });
  h+=`</tbody></table></div><p class="note">${lang==="vi"?"Cấp 1 là từ vựng: học bằng thẻ từ (hoặc Quizlet).":"Level 1 is vocabulary: learn it with the word cards (or Quizlet)."}</p></section>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>{view="words";store.set("lxs-view",view);syncTop();openCards(+b.dataset.wt,1)});
  app.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>start(+b.dataset.si));
}
function renderWordMap(app){
  const vi=lang==="vi";
  let h=`<section class="panel"><h2>选一组生词 · ${vi?"Chọn một bộ từ":"Choose a word set"}</h2>
  <p class="note">${vi?"Nhìn chữ Hán, thử đọc to. Chạm vào thẻ để lật: nghe phát âm và xem nghĩa tiếng Anh, tiếng Việt.":"Look at the characters and try to say the word. Tap a card to flip it: hear it and see the English and Vietnamese meaning."}</p>
  <div class="scroll"><table class="sets"><thead><tr><th>${vi?"Chủ đề":"Theme"}</th>${[1,2,3].map(l=>`<th>${lvName(l)}</th>`).join("")}</tr></thead><tbody>`;
  THEMES.forEach((T,ti)=>{
    h+=`<tr><td class="tn">${ti+1}. ${tName(ti)}<div class="note" style="font-weight:400">${T[0]}</div></td>`;
    [1,2,3].forEach(l=>{const ws=WMAP[ti].L[l-1];
      h+=`<td><button class="setbtn" data-wt="${ti}" data-wl="${l}"><b>${ws.length} ${vi?"từ":"words"}</b><span class="wl">${esc(ws.slice(0,5).map(w=>w[0]).join("、"))}…</span><span>${esc(WMAP[ti].cd[l-1][LI()])}</span></button></td>`});
    h+=`</tr>`;
  });
  h+=`</tbody></table></div></section>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>openCards(+b.dataset.wt,+b.dataset.wl));
}
function openCards(ti,l){wsel={ti,l};wflip=new Set();worder=WMAP[ti].L[l-1].map((_,i)=>i);render();window.scrollTo({top:0,behavior:"smooth"})}
const sayWord=h=>say(h.replace(/／/g,"，"));
function renderCards(app){
  const vi=lang==="vi",{ti,l}=wsel,ws=WMAP[ti].L[l-1];
  app.innerHTML=`<section class="panel">
    <div class="qhead"><h2>${ti+1}. ${tName(ti)} · ${lvName(l)}</h2><span class="pill">${ws.length} ${vi?"từ":"words"}</span></div>
    <p class="note">${esc(WMAP[ti].cd[l-1][LI()])}</p>
    <div class="cardbar"><div><button class="btn" id="wBack">← ${vi?"Quay lại":"Back"}</button></div>
      <div><button class="btn" id="wMix">${vi?"Xáo trộn":"Shuffle"}</button><button class="btn" id="wAll">${vi?"Lật hết":"Flip all"}</button><button class="btn" id="wNone">${vi?"Úp hết":"Hide all"}</button></div></div>
    <div class="cards">${worder.map(i=>{const [h,p,en,v,f]=ws[i],a=vi?v:en,b2=vi?en:v;
      return `<button class="card${wflip.has(i)?" on":""}" data-wi="${i}" aria-pressed="${wflip.has(i)}" aria-label="${esc(h)}"><span class="in">
        <span class="fc fr">${f?`<span class="fw">${vi?"từ chức năng":"function word"}</span>`:""}<span class="h">${esc(h)}</span><span class="p">${esc(p)}</span></span>
        <span class="fc bk"><span class="snd" aria-hidden="true">🔊</span><span class="h">${esc(h)}</span><span class="p">${esc(p)}</span><span class="m">${esc(a)}</span><span class="m2">${esc(b2)}</span></span>
      </span></button>`}).join("")}</div>
    ${"speechSynthesis" in window?"":`<p class="note">${vi?"Trình duyệt này không phát được âm thanh.":"This browser can't play the sound."}</p>`}
  </section>`;
  $("wBack").onclick=()=>{wsel=null;render()};
  $("wMix").onclick=()=>{worder=shuffle(worder);render()};
  $("wAll").onclick=()=>{ws.forEach((_,i)=>wflip.add(i));render()};
  $("wNone").onclick=()=>{wflip.clear();render()};
  app.querySelectorAll("[data-wi]").forEach(c=>c.onclick=()=>{const i=+c.dataset.wi,on=!wflip.has(i);
    if(on){wflip.add(i);sayWord(ws[i][0])}else wflip.delete(i);
    c.classList.toggle("on",on);c.setAttribute("aria-pressed",String(on))});
}
function start(si){
  const S=SETS[si];
  run={si,order:shuffle(S.q.map((_,i)=>i)),i:0,items:S.q.map(()=>({tries:0,first:"",shown:false,ok:false})),tray:[],bank:null,state:"build"};
  newQ();render();window.scrollTo({top:0,behavior:"smooth"});
}
function newQ(){
  const q=curQ();let b=shuffle(q.t.map((_,k)=>k));
  if(b.every((k,j)=>k===j)&&b.length>1)b=b.slice(1).concat(b[0]);
  run.bank=b;run.tray=[];run.state="build";
}
const curQ=()=>SETS[run.si].q[run.order[run.i]];
const curItem=()=>run.items[run.order[run.i]];
function tileHTML(tk,idx,where,used){return `<button class="tile${used?" used":""}" data-${where}="${idx}" aria-label="${esc(tk[0])}"${used?' tabindex="-1" aria-hidden="true"':""}><span class="h">${esc(tk[0])}</span><span class="p">${esc(tk[1])}</span></button>`}
function renderQ(app){
  const S=SETS[run.si],q=curQ(),it=curItem(),locked=run.state==="ok"||run.state==="shown";
  const prompt=lang==="vi"?q.vi:q.en;
  let fb="";
  if(run.state==="ok")fb=`<div class="fb ok" role="status">${it.tries===1?"对了！一次就对。":"对了！"}<span class="ans">${esc(zh(q))}<span class="p">${esc(pyOf(q))}</span></span></div>`;
  else if(run.state==="bad")fb=`<div class="fb bad" role="status">还不对，再试一次。Not quite — try again.</div>`;
  else if(run.state==="shown")fb=`<div class="fb show" role="status">答案 Answer<span class="ans">${esc(zh(q))}<span class="p">${esc(pyOf(q))}</span></span></div>`;
  const dots=run.order.map((qi,k)=>{const x=run.items[qi];const c=x.shown?"shown":x.ok?(x.tries===1?"first":"retry"):"";return `<span class="dot ${c}${k===run.i?" cur":""}">${k+1}</span>`}).join("");
  app.innerHTML=`<section class="panel">
    <div class="qhead"><span class="qnum">${run.i+1} / ${run.order.length}</span><span class="pill">${S.t}. ${tName(S.t-1)} · ${lvName(S.l)}</span></div>
    <p class="prompt">${esc(prompt)}</p>
    <div class="label">我的句子 · My sentence</div>
    <div class="tray ${run.state==="ok"?"ok":run.state==="bad"?"bad":""}" id="tray">${run.tray.length?run.tray.map(k=>tileHTML(q.t[k],k,"tr",false)).join(""):'<span class="ph">点下面的词，按顺序放进来。Tap the words below in order.</span>'}${run.tray.length?`<span class="end">${q.e}</span>`:""}</div>
    <div class="label">词语 · Words</div>
    <div class="bank">${run.bank.map(k=>tileHTML(q.t[k],k,"bk",run.tray.includes(k))).join("")}</div>
    ${fb}
    <div class="btnrow"><div>
      ${locked?"":`<button class="btn primary" id="bCheck" ${run.tray.length===q.t.length?"":"disabled"}>检查 Check</button><button class="btn" id="bClear" ${run.tray.length?"":"disabled"}>清空 Clear</button>`}
      ${locked&&"speechSynthesis" in window?`<button class="btn" id="bSay">听一听 Listen</button>`:""}
    </div><div>
      ${locked?"":`<button class="btn" id="bShow" ${it.tries?"":"disabled"} title="先试一次才能看答案">看答案 Show answer</button>`}
      ${locked?`<button class="btn primary" id="bNext">${run.i+1<run.order.length?"下一题 Next":"看结果 See results"}</button>`:""}
    </div></div>
    <div class="dots" aria-label="进度">${dots}</div>
    <div><button class="btn" id="bQuit" style="font-size:13px;padding:6px 12px">返回 Back to sets</button></div>
  </section>`;
  if(!locked){
    app.querySelectorAll("[data-bk]").forEach(b=>b.onclick=()=>{const k=+b.dataset.bk;if(!run.tray.includes(k)){run.tray.push(k);if(run.state==="bad")run.state="build";render()}});
    app.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{run.tray=run.tray.filter(k=>k!==+b.dataset.tr);if(run.state==="bad")run.state="build";render()});
    if($("bCheck"))$("bCheck").onclick=check;
    if($("bClear"))$("bClear").onclick=()=>{run.tray=[];run.state="build";render()};
    if($("bShow"))$("bShow").onclick=()=>{curItem().shown=true;run.state="shown";render()};
  } else {
    $("bNext").onclick=()=>{run.i++;if(run.i<run.order.length)newQ();else finish();render()};
    if($("bSay"))$("bSay").onclick=()=>say(zh(q));
  }
  $("bQuit").onclick=()=>{run=null;render()};
}
function check(){
  const q=curQ(),it=curItem(),mine=run.tray.map(k=>q.t[k][0]);
  it.tries++;if(it.tries===1)it.first=mine.join("")+q.e;
  const ans=[q.t.map(x=>x[0])].concat(q.alt||[]);
  if(ans.some(a=>a.join("|")===mine.join("|"))){it.ok=true;run.state="ok"}else run.state="bad";
  render();
}
// pick the most natural Mandarin voice this device offers (neural/online voices first)
const VOICE_RANK=[/xiaoxiao|xiaoyi|yunxi|natural|online/i,/google.*(普通话|mandarin|chinese)|google/i,/lili|yu-?shu|tingting|ting-ting|premium|enhanced|增强/i,/huihui|kangkang|yaoyao/i];
let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang)&&!/(HK|TW|yue|Hant)/i.test(v.lang+v.name));if(!vs.length)return null;const score=v=>{const i=VOICE_RANK.findIndex(r=>r.test(v.name));return (i<0?9:i)+(/CN|Hans/i.test(v.lang)?0:.5)};vs.sort((a,b)=>score(a)-score(b));return vs[0]}catch(e){return null}}
try{zhVoice=pickVoice();speechSynthesis.addEventListener("voiceschanged",()=>{zhVoice=pickVoice()})}catch(e){}
function say(text){try{const u=new SpeechSynthesisUtterance(text);if(zhVoice)u.voice=zhVoice;u.lang=zhVoice?zhVoice.lang:"zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function finish(){
  const S=SETS[run.si];run.date=today();
  const c=counts();store.set(doneKey(run.si),`${run.date} · ${c.first}/${S.q.length}`);
}
function counts(){const it=run.items;return{first:it.filter(x=>x.ok&&x.tries===1&&!x.shown).length,retry:it.filter(x=>x.ok&&x.tries>1).length,shown:it.filter(x=>x.shown).length}}
function status(x){return x.shown?"shown":x.tries===1?"first":"retry"}
const TAG={first:"一次就对",retry:"改了以后对",shown:"看了答案"};
function renderResult(app){
  const S=SETS[run.si],c=counts(),name=$("who").value.trim();
  const rows=S.q.map((q,qi)=>{const x=run.items[qi],s=status(x);
    return `<tr><td class="hz">${esc(zh(q))}${s!=="first"&&x.first?`<span class="mine">第一次 First try：${esc(x.first)}</span>`:""}</td><td><span class="tag ${s}">${TAG[s]}</span></td></tr>`}).join("");
  app.innerHTML=`<section class="panel">
    <h2>完成了！${name?esc(name)+" · ":""}${S.t}. ${tName(S.t-1)} · ${lvName(S.l)}</h2>
    <div class="score"><div><b>${c.first}</b><span>一次就对 First try</span></div><div><b>${c.retry}</b><span>改了以后对 After a retry</span></div><div><b>${c.shown}</b><span>看了答案 Answer shown</span></div></div>
    <div class="scroll"><table class="rlist"><tbody>${rows}</tbody></table></div>
    ${name?"":`<p class="msg err">先在上面写你的名字，再保存。Write your name at the top before saving.</p>`}
    <div class="btnrow"><div><button class="btn primary" id="bPdf" hidden>保存 PDF · Save PDF</button><button class="btn" id="bCopy">复制结果 · Copy result</button></div>
      <div><button class="btn" id="bAgain">再做一次 Try again</button><button class="btn" id="bSets">换一组 Other sets</button></div></div>
    <p class="msg" id="rMsg" aria-live="polite"></p>
  </section>`;
  $("bAgain").onclick=()=>start(run.si);
  $("bSets").onclick=()=>{run=null;render()};
  $("bCopy").onclick=async()=>{const t=resultText();try{await navigator.clipboard.writeText(t);setMsg("已复制，可以贴到微信、Zalo 或 WhatsApp 发给老师。Copied.")}catch(e){setMsg("没能自动复制。请截图发给老师。Please take a screenshot instead.",true)}};
  if(downloads){$("bPdf").hidden=false;$("bPdf").onclick=savePdf}
}
function setMsg(t,err){const m=$("rMsg");if(m){m.textContent=t;m.classList.toggle("err",!!err)}}
function resultText(){
  const S=SETS[run.si],c=counts(),name=$("who").value.trim()||"(no name)";
  return [`乐学坊句子练习 · ${name} · ${run.date}`,`${S.t}. ${S.zh} · Level ${S.l}`,`一次就对 ${c.first} · 改了以后对 ${c.retry} · 看了答案 ${c.shown} / ${S.q.length}`,
    ...S.q.map((q,qi)=>{const x=run.items[qi],s=status(x);return `${s==="first"?"✓":s==="retry"?"↻":"?"} ${zh(q)}${s!=="first"&&x.first?"（第一次："+x.first+"）":""}`})].join("\n");
}
// ---- PDF: draw the report on a canvas (keeps Chinese glyphs), place it on an A4 page ----
async function savePdf(){
  const name=$("who").value.trim();
  if(!name){setMsg("先在上面写你的名字。Write your name at the top first.",true);$("who").focus();return}
  if(!window.jspdf){setMsg("PDF 工具没有加载，请用“复制结果”。The PDF tool did not load — use Copy result.",true);return}
  try{await document.fonts.ready}catch(e){}
  const S=SETS[run.si],c=counts(),W=1240,H=1754,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d"),HAN='"Noto Serif SC","Songti SC",serif',UI='"Noto Sans SC","PingFang SC",sans-serif';
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);
  g.fillStyle="#2f7a63";g.fillRect(0,0,W,14);
  g.fillStyle="#1b2a27";g.font=`700 52px ${HAN}`;g.fillText("乐学坊句子练习",90,130);
  g.font=`400 28px ${UI}`;g.fillStyle="#5b6b66";
  g.fillText(`名字 Name：${name}      日期 Date：${run.date}`,90,190);
  g.fillText(`${S.t}. ${S.zh} · Level ${S.l} — ${S.cd[0]}`,90,236);
  const box=(x,label,val,col)=>{g.fillStyle=col;g.font=`700 64px ${UI}`;g.fillText(String(val),x,340);g.fillStyle="#5b6b66";g.font=`400 24px ${UI}`;g.fillText(label,x,378)};
  box(90,"一次就对 First try",c.first,"#22703c");box(470,"改了以后对 After a retry",c.retry,"#2f7a63");box(880,"看了答案 Answer shown",c.shown,"#8a5a00");
  g.strokeStyle="#d3dcd6";g.lineWidth=2;g.beginPath();g.moveTo(90,420);g.lineTo(W-90,420);g.stroke();
  let y=490;
  S.q.forEach((q,qi)=>{const x=run.items[qi],s=status(x);
    g.fillStyle="#5b6b66";g.font=`400 24px ${UI}`;g.fillText(String(qi+1).padStart(2," "),90,y);
    g.fillStyle="#1b2a27";g.font=`500 38px ${HAN}`;g.fillText(zh(q),150,y);
    const tc=s==="first"?"#22703c":s==="retry"?"#2f7a63":"#8a5a00";g.fillStyle=tc;g.font=`500 24px ${UI}`;
    const tw=g.measureText(TAG[s]).width;g.fillText(TAG[s],W-90-tw,y);
    y+=40;
    if(s!=="first"&&x.first){g.fillStyle="#b23a2c";g.font=`400 26px ${HAN}`;g.fillText("第一次 First try：“"+x.first+"”",150,y);y+=40}
    y+=34;
  });
  g.fillStyle="#8a9792";g.font=`400 20px ${UI}`;g.fillText("✓ 一次就对 = 第一次检查就排对；改了以后对 = 检查后改正；看了答案 = 没排对，看了正确答案。",90,H-70);
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
  const blob=pdf.output("blob");
  try{await downloads.save({filename:`句子练习-${name}-主题${S.t}-L${S.l}-${run.date}.pdf`,data:blob});setMsg("PDF 已保存。请把它发给老师。Saved — send it to your teacher.")}
  catch(e){if(e&&e.code==="declined")setMsg("没有保存。Not saved.");else if(e&&e.code==="rate_limited")setMsg("请稍等再试。Please wait and try again.",true);else{setMsg("这里不能保存 PDF，请用“复制结果”或截图。PDF saving isn't available here — use Copy result or a screenshot.",true);$("bPdf").hidden=true}}
}
let downloads=null;
syncTop();render();
(async()=>{try{downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){downloads=null}
  if(!downloads)downloads={save:async({filename,data})=>{filename=filename.replace("句子练习","Lexuefang-sentences").replace("主题","T").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7e]/g,"").replace(/\s+/g,"_");const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  if(downloads&&run&&run.i>=run.order.length&&$("bPdf")){$("bPdf").hidden=false;$("bPdf").onclick=savePdf}})();
</script>

</body></html>
